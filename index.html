:root{
  --bg:#FFE99B; --card:#FFFEF6; --line:#FFE58F; --yolk:#FFD84A; --yolk-d:#F5C518;
  --ink:#6B4526; --ink-soft:#A88459; --pop:#FFF0A8;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Kkukkukk","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding:calc(16px + var(--safe-t)) 16px calc(32px + var(--safe-b));
  background-image:
    radial-gradient(#FFFFFF 3px, transparent 3.5px),
    radial-gradient(#FFFFFF 3px, transparent 3.5px);
  background-size:44px 44px,44px 44px;
  background-position:0 0,22px 22px;
  background-attachment:fixed;
}
.splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));overflow:auto;
  background-color:var(--bg);
  background-image:
    radial-gradient(#FFFFFF 3px, transparent 3.5px),
    radial-gradient(#FFFFFF 3px, transparent 3.5px);
  background-size:44px 44px,44px 44px;
  background-position:0 0,22px 22px;}
.splash[hidden]{display:none}
.splash-inner{max-width:400px;width:100%;text-align:center}
.s-chick{width:100px;margin:0 auto 8px}
.s-chick svg{width:100%;height:auto;overflow:visible}
.s-title{margin:0 0 2px;font-size:28px;font-weight:400;letter-spacing:.02em}
.s-sub{margin:0 0 22px;color:var(--ink-soft);font-size:15px}
.s-card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:22px 20px 20px;
  text-align:left;box-shadow:0 6px 0 var(--line)}
.s-card h2{margin:0 0 14px;text-align:center;font-weight:400;font-size:20px}
.s-submit{width:100%;height:52px;border-radius:18px;font-size:16px;margin-top:2px}
.s-guest{width:auto;height:auto;background:transparent;border:0;box-shadow:none;color:var(--ink-soft);
  text-decoration:underline;font-size:14px;margin:20px auto 0;padding:4px;display:block}
.s-guest:active{opacity:.7;transform:none}

main{max-width:430px;margin:0 auto}
h1{margin:0 0 4px;text-align:center;font-weight:400;font-size:26px;letter-spacing:.02em}
.sub{margin:0 0 14px;text-align:center;color:var(--ink-soft);font-size:15px}

.authbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-soft);margin:0 4px 12px}
.authbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.authbar button{flex:none}
.authbar button{width:auto;height:auto;padding:7px 16px;border-radius:99px;font-size:13px;background:#fff;
  border:2px solid var(--line);color:var(--ink);box-shadow:none}
.authbar button:disabled{opacity:.5;cursor:default}
.authbar button:active:not(:disabled){transform:scale(.95)}
.linklike{width:auto;height:auto;background:transparent;border:0;box-shadow:none;color:var(--ink-soft);
  text-decoration:underline;font-size:14px;padding:12px 0 0;display:block;margin:0 auto}
.linklike:active{transform:none;opacity:.7}
.autherr{font-size:13px;color:#B23B2E;background:#FFF0EE;border:1.5px solid #F5C6C0;border-radius:12px;padding:9px 12px;margin:0 0 12px;line-height:1.4}
.import-row{margin:0 0 14px}
.import-btn{width:100%;height:auto;min-height:46px;border-radius:18px;font-size:14px;line-height:1.4;padding:10px 14px;
  background:#fff;border:2.5px dashed var(--ink-soft);color:var(--ink);box-shadow:none}
.import-btn:active{background:var(--pop);transform:scale(.98)}

.tabs{display:flex;gap:8px;background:var(--card);border:2.5px solid var(--line);border-radius:99px;padding:5px;margin-bottom:18px}
.tabbtn{flex:1;border:0;background:transparent;color:var(--ink-soft);font:inherit;font-size:15px;
  padding:9px 6px;border-radius:99px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tabbtn.active{background:var(--yolk);color:var(--ink)}
.tabbtn .cnt{background:#fff;color:var(--ink-soft);font-size:12px;border-radius:99px;padding:1px 7px;min-width:1.4em}
.tabbtn.active .cnt{color:var(--ink)}

.face{position:relative;background:var(--card);border:3px solid var(--line);border-radius:36px;
  padding:64px 12px 20px;margin-top:46px;text-align:center;box-shadow:0 6px 0 var(--line)}
.chick{position:absolute;left:50%;top:-50px;width:96px;height:80px;transform:translateX(-50%)}
.chick svg{width:100%;height:100%;overflow:visible}
.running .chick{animation:hop .5s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateX(-50%) translateY(0) rotate(-3deg)}to{transform:translateX(-50%) translateY(-6px) rotate(3deg)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

.big{font-size:clamp(52px,17vw,76px);line-height:1.1;white-space:nowrap;letter-spacing:0}
.d{display:inline-block;width:.62em;text-align:center}
.d.s{width:.34em}
.big .cs{font-size:.62em;color:var(--ink-soft)}
.cur{margin-top:6px;color:var(--ink-soft);font-size:17px;white-space:nowrap}
.cur b{font-weight:400;color:var(--ink)}

.startnum-row[hidden]{display:none}
.startnum-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border:2.5px dashed var(--line);border-radius:20px;padding:10px 10px 10px 16px;margin:16px 4px 0;font-size:15px}
.startnum-row label{color:var(--ink-soft)}
.stepper{display:flex;align-items:center;gap:0;background:#fff;border:2.5px solid var(--line);border-radius:16px;overflow:hidden}
.stepbtn{width:38px;height:38px;border-radius:0;font-size:18px;background:#fff;border:0;box-shadow:none;color:var(--ink)}
.stepbtn:active{background:var(--pop);transform:none}
.stepper input{width:3.2em;height:38px;border:0;border-left:2.5px solid var(--line);border-right:2.5px solid var(--line);
  text-align:center;font:inherit;font-size:17px;color:var(--ink);background:#fff;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none;background:var(--pop)}

.btns{display:flex;justify-content:space-between;gap:14px;margin:22px 4px 6px}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;border-radius:50%;
  width:96px;height:96px;font-size:21px;display:grid;place-items:center;position:relative;
  transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
.b-side{background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.b-side:active{box-shadow:0 1px 0 var(--line)}
.b-main{background:var(--yolk);border:3px solid var(--yolk-d);box-shadow:0 5px 0 var(--yolk-d)}
.b-main:active{box-shadow:0 1px 0 var(--yolk-d)}
.b-main.stop{background:#fff;border-color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.b-main.stop:active{box-shadow:0 1px 0 var(--ink)}

.save-row{margin:4px 4px 0}
.save-btn{width:100%;border-radius:22px;height:52px;font-size:16px;background:#fff;
  border:2.5px dashed var(--ink-soft);color:var(--ink);box-shadow:none}
.save-btn:active{transform:scale(.98);background:var(--pop)}

.laps{list-style:none;margin:22px 0 0;padding:0}
.lap{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;
  background:var(--card);border:2.5px solid var(--line);border-radius:22px;padding:10px 10px 10px 14px;margin-bottom:10px}
.lap.live{background:var(--pop);border-style:dashed}
.lap .n{font-size:17px;width:4.6em;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.lap .t{font-size:24px;white-space:nowrap}
.lap .tot{font-size:14px;color:var(--ink-soft);text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--yolk);white-space:nowrap}
.tag.slow{background:#fff;border:2px solid var(--ink)}
.iconbtn{width:34px;height:34px;font-size:18px;background:#fff;border:2.5px solid var(--line);color:var(--ink-soft);box-shadow:none;line-height:1}
.iconbtn:active{transform:scale(.9);box-shadow:none}
.iconbtn:hover{background:var(--pop)}
.lap.out,.setcard.out{animation:out .22s ease-in forwards}
@keyframes out{to{opacity:0;transform:translateX(30px) scale(.9)}}
.empty{text-align:center;color:var(--ink-soft);padding:22px 0;font-size:16px;line-height:1.5}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:26px 6px 0;font-size:16px;color:var(--ink-soft)}

.setlist{list-style:none;margin:0;padding:0}
.setcard{background:var(--card);border:2.5px solid var(--line);border-radius:26px;padding:16px 14px;margin-bottom:12px;cursor:pointer;text-align:left}
.setcard:active{transform:scale(.99)}
.setcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.setcard .name{font-size:19px}
.setcard .date{font-size:12px;color:var(--ink-soft);white-space:nowrap;margin-top:4px}
.setcard .note{font-size:14px;color:var(--ink-soft);margin:6px 0 10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45;min-height:1.45em}
.setcard .stats{display:flex;gap:14px;font-size:13px;color:var(--ink-soft);align-items:center}
.setcard .stats b{color:var(--ink);font-weight:400;font-size:15px}

.overlay{position:fixed;inset:0;background:rgba(107,69,38,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.overlay[hidden]{display:none}
.sheet{background:var(--card);border-radius:30px 30px 0 0;padding:22px 20px calc(24px + var(--safe-b));width:100%;max-width:430px;
  max-height:86vh;overflow:auto;border:3px solid var(--line);border-bottom:none}
@media (min-width:480px){.overlay{align-items:center;padding:20px}.sheet{border-radius:30px;border-bottom:3px solid var(--line);max-height:82vh}}
.sheet h2{margin:0 0 14px;font-weight:400;font-size:21px;text-align:center}
.field{display:block;margin-bottom:14px;font-size:14px;color:var(--ink-soft)}
.field input,.field textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;color:var(--ink);
  background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:11px 13px;resize:vertical}
.field textarea{min-height:76px;line-height:1.4}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink-soft)}
.sheet-btns{display:flex;gap:10px;margin-top:6px}
.sheet-btns button{flex:1;width:auto;height:50px;border-radius:18px;font-size:16px}
.ghost{background:#fff;border:2.5px solid var(--line);color:var(--ink-soft);box-shadow:none}
.solid{background:var(--yolk);border:2.5px solid var(--yolk-d);color:var(--ink);box-shadow:none}

.detail{position:relative;text-align:center}
.detail .close{position:absolute;right:14px;top:14px;width:36px;height:36px;background:#fff;border:2.5px solid var(--line);box-shadow:none;color:var(--ink-soft)}
.detail h2{padding-right:36px}
.detail .note{white-space:pre-wrap;text-align:left;font-size:15px;color:var(--ink-soft);
  background:#fff;border:2px dashed var(--line);border-radius:16px;padding:12px 14px;margin:0 0 16px;line-height:1.5}
.dstats{display:flex;justify-content:space-around;margin-bottom:18px}
.dstats div{display:flex;flex-direction:column;align-items:center;gap:3px}
.dstats span{font-size:22px}
.dstats small{font-size:12px;color:var(--ink-soft)}
.detail .laps{margin-top:0;text-align:left}
.detail .lap .n{width:auto;flex:1}

.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#FFF6CF;padding:11px 20px;border-radius:99px;font-size:15px;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){.running .chick,.eye{animation:none}.lap.out,.setcard.out{animation-duration:.01s}}
@media (max-width:360px){button{width:84px;height:84px;font-size:19px}}
</style>
</head>
<body>

  <div class="splash-inner">
    <div class="s-chick" aria-hidden="true">

        <input id="splashEmail" type="email" autocomplete="email" placeholder="me@example.com">
      </label>
      <label class="field">비밀번호
        <input id="splashPw" type="password" autocomplete="current-password" placeholder="6자 이상">

</div>
<main id="app">
  <h1>삐약 스톱워치</h1>
  <p class="sub">문제 하나 풀 때마다 랩!</p>

  <div class="authbar" id="authbar">
    <span id="authStatus">게스트로 사용 중</span>
    <button id="authBtn" type="button">로그인</button>
  </div>

  <nav class="tabs">
    <button class="tabbtn active" data-tab="timer" type="button">타이머</button>
    <button class="tabbtn" data-tab="archive" type="button">기록 보관함 <span class="cnt" id="setCount">0</span></button>
  </nav>

  <section id="view-timer">
    <section class="face" id="face" aria-live="off">
      <div class="chick" aria-hidden="true">
        <svg viewBox="0 0 96 80">
          <path d="M48 6c1-6 7-6 8-1-3 0-5 1-6 4z" fill="#F5C518"/>
          <ellipse cx="48" cy="46" rx="42" ry="32" fill="#FFD84A" stroke="#F5C518" stroke-width="3"/>
          <ellipse class="eye" cx="32" cy="42" rx="4.5" ry="5.5" fill="#6B4526"/>
          <ellipse class="eye" cx="64" cy="42" rx="4.5" ry="5.5" fill="#6B4526"/>
          <ellipse cx="22" cy="54" rx="7" ry="4.5" fill="#FFB27A" opacity=".55"/>
          <ellipse cx="74" cy="54" rx="7" ry="4.5" fill="#FFB27A" opacity=".55"/>
          <path d="M43 50h10l-5 7z" fill="#F08A2E"/>
        </svg>
      </div>
      <div class="big" id="big" role="timer" aria-label="경과 시간">00:00.00</div>
      <div class="cur" id="cur">지금 구간 <b>00:00.00</b></div>
    </section>

    <div class="startnum-row" id="startNumRow">
      <label for="startNum">랩 시작 번호</label>
      <div class="stepper">
        <button class="stepbtn" id="snMinus" type="button" aria-label="시작 번호 줄이기">−</button>
        <input id="startNum" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="랩 시작 번호">
        <button class="stepbtn" id="snPlus" type="button" aria-label="시작 번호 늘리기">+</button>
      </div>
    </div>

    <div class="btns">
      <button class="b-side" id="left" type="button">랩</button>
      <button class="b-main" id="right" type="button">시작</button>
    </div>

    <div class="save-row" id="saveRow" hidden>
      <button class="save-btn" id="saveBtn" type="button">이 세트 저장하기</button>
    </div>

    <div class="head" id="head" hidden><span id="count"></span><span id="avgNow"></span></div>
    <ul class="laps" id="laps"></ul>
    <div class="empty" id="empty">아직 기록이 없어요.<br>시작하고 랩을 눌러보세요!</div>
  </section>

  <section id="view-archive" hidden>
    <div class="import-row" id="importRow" hidden>
      <button class="import-btn" id="importBtn" type="button">이 기기에 남아있는 게스트 기록 내 계정으로 가져오기</button>
    </div>
    <ul class="setlist" id="setlist"></ul>
    <div class="empty" id="setEmpty">저장된 세트가 없어요.<br>타이머에서 풀이를 마치면<br>세트로 저장해보세요!</div>
  </section>
</main>

<div class="overlay" id="authOverlay" hidden>
  <div class="sheet">
    <h2 id="authTitle">로그인</h2>
    <label class="field">이메일
      <input id="authEmail" type="email" autocomplete="email" placeholder="me@example.com">

      <input id="authPw" type="password" autocomplete="current-password" placeholder="6자 이상">

<div class="overlay" id="saveOverlay" hidden>
  <div class="sheet">

      <svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <h2 id="dTitle">이름</h2>
    <p class="note" id="dNote"></p>
    <div class="dstats">
      <div><span id="dAvg"></span><small>평균 소요</small></div>
      <div><span id="dTotal"></span><small>총 시간</small></div>
      <div><span id="dCount"></span><small>문항 수</small></div>

    <ul class="laps" id="dLaps"></ul>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ====== Supabase 설정 (필수) ======
  // supabase.com에서 무료 프로젝트를 만든 뒤 Project Settings > API 에서
  // Project URL 과 anon public key 를 아래에 붙여넣고 다시 배포하세요.
  //
  // ⚠️ 매우 중요 — 앞으로 기능을 추가해서 이 파일을 새로 받을 때마다:
  //   1. 아래 SUPABASE_URL / SUPABASE_ANON_KEY 두 값은 "지금 쓰고 있는 값"을
  //      그대로 유지해야 합니다. 값이 바뀌면 다른 프로젝트(=다른 데이터베이스)를
  //      가리키게 되어 로그인해도 예전 기록이 안 보입니다.
  //   2. Supabase의 "sets" 테이블 이름과 기존 컬럼(user_id, name, note, laps,
  //      saved_at)도 그대로 유지해야 합니다. 새 기능 때문에 컬럼을 더 추가하는
  //      건 안전하지만(예: alter table public.sets add column ...), 기존 테이블을
  //      지우고 새로 만들거나 이름을 바꾸면 예전 기록을 잃게 됩니다.
  //   3. 가장 안전한 방법: 다음에 기능을 추가해달라고 할 때, 새로 만든 파일이
  //      아니라 "지금 이 값이 채워진 파일"을 그대로 건네주고 그 위에 수정해
  //      달라고 요청하세요. 그러면 이 설정이 자동으로 유지됩니다.
  var SUPABASE_URL="YOUR_SUPABASE_URL";
  var SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
  var cloudReady=!!(window.supabase && SUPABASE_URL.indexOf("YOUR_SUPABASE_URL")===-1 && SUPABASE_ANON_KEY.indexOf("YOUR_SUPABASE_ANON_KEY")===-1);
  var sb=cloudReady?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
  var user=null;
  function useCloud(){return cloudReady&&!!user}
  var KEY="piyak-stopwatch-v1", SETKEY="piyak-sets-v1";
  var st={running:false,startAt:0,base:0,lapBase:0,laps:[],seq:0,startNum:1};
  var sets=[];
  var tab="timer";
  var $=function(id){return document.getElementById(id)};
  var big=$("big"),cur=$("cur"),left=$("left"),right=$("right"),lapsEl=$("laps"),empty=$("empty"),
      head=$("head"),count=$("count"),avgNow=$("avgNow"),face=$("face"),saveRow=$("saveRow"),saveBtn=$("saveBtn"),
      startNumRow=$("startNumRow"),startNumInput=$("startNum"),snMinus=$("snMinus"),snPlus=$("snPlus"),
      viewTimer=$("view-timer"),viewArchive=$("view-archive"),setlist=$("setlist"),setEmpty=$("setEmpty"),setCount=$("setCount"),
      saveOverlay=$("saveOverlay"),setName=$("setName"),setNote=$("setNote"),saveCancel=$("saveCancel"),saveConfirm=$("saveConfirm"),
      detailOverlay=$("detailOverlay"),detailClose=$("detailClose"),dTitle=$("dTitle"),dNote=$("dNote"),dAvg=$("dAvg"),dTotal=$("dTotal"),dCount=$("dCount"),dLaps=$("dLaps"),
      authbar=$("authbar"),authStatus=$("authStatus"),authBtn=$("authBtn"),
      authOverlay=$("authOverlay"),authTitle=$("authTitle"),authEmail=$("authEmail"),authPw=$("authPw"),authErr=$("authErr"),
      authCancel=$("authCancel"),authSubmit=$("authSubmit"),authToggle=$("authToggle"),
      importRow=$("importRow"),importBtn=$("importBtn"),
      splash=$("splash"),splashTitle=$("splashTitle"),splashEmail=$("splashEmail"),splashPw=$("splashPw"),
      splashErr=$("splashErr"),splashSubmit=$("splashSubmit"),splashToggle=$("splashToggle"),splashGuestBtn=$("splashGuestBtn"),
      toastEl=$("toast");
  var raf=0,wake=null,toastT=0;

  function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
  function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s==="object")st=Object.assign(st,s)}catch(e){}}
  function saveSets(){try{localStorage.setItem(SETKEY,JSON.stringify(sets))}catch(e){}}
  function loadLocalSetsRaw(){try{var s=JSON.parse(localStorage.getItem(SETKEY)||"null");return Array.isArray(s)?s:[]}catch(e){return[]}}
  function hasGuestSets(){return loadLocalSetsRaw().length>0}
  function rowToSet(row){return{id:row.id,name:row.name,note:row.note||"",laps:row.laps||[],savedAt:new Date(row.saved_at).getTime()}}
  async function loadSets(){
    if(useCloud()){
      var res=await sb.from("sets").select("*").order("saved_at",{ascending:false});
      if(res.error){showToast("불러오기 실패: "+res.error.message);sets=[]}
      else sets=res.data.map(rowToSet);
    }else{
      sets=loadLocalSetsRaw();
    }
    renderArchive();
  }

  function now(){return st.running?st.base+(Date.now()-st.startAt):st.base}

  function parts(ms){
    ms=Math.max(0,Math.floor(ms/10));
    var cs=ms%100,s=Math.floor(ms/100),sec=s%60,m=Math.floor(s/60)%60,h=Math.floor(s/3600);
    return {h:h,m:m,s:sec,cs:cs};
  }
  function p2(n){return n<10?"0"+n:""+n}
  function txt(ms){var p=parts(ms);return (p.h?p.h+":":"")+p2(p.m)+":"+p2(p.s)+"."+p2(p.cs)}
  function spans(str){
    var o="";
    for(var i=0;i<str.length;i++){var c=str[i];o+='<span class="d'+(c==":"||c=="."?" s":"")+'">'+c+"</span>"}
    return o;
  }
  function html(ms){
    var p=parts(ms);
    var main=(p.h?p.h+":":"")+p2(p.m)+":"+p2(p.s);
    return spans(main)+'<span class="cs">'+spans("."+p2(p.cs))+"</span>";
  }
  function plain(ms){return spans(txt(ms))}
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return c=="&"?"&amp;":c=="<"?"&lt;":"&gt;"})}
  function avgOf(laps){if(!laps.length)return 0;var sum=0;for(var i=0;i<laps.length;i++)sum+=laps[i].t;return sum/laps.length}
  function fmtDate(ts){
    var d=new Date(ts),mo=d.getMonth()+1,da=d.getDate(),h=d.getHours(),mi=d.getMinutes();
    var ap=h<12?"오전":"오후",h12=h%12;if(h12===0)h12=12;
    return mo+"월 "+da+"일 "+ap+" "+h12+":"+p2(mi);
  }

  var lastBig="",lastCur="";
  function tick(){
    var t=now(),lt=t-st.lapBase;
    var a=html(t);if(a!==lastBig){big.innerHTML=a;lastBig=a}
    var b=plain(lt);if(b!==lastCur){cur.innerHTML="지금 구간 <b>"+b+"</b>";lastCur=b}
    var live=document.getElementById("liveT");if(live){var l=plain(lt);if(live.__v!==l){live.innerHTML=l;live.__v=l}}
    if(st.running)raf=requestAnimationFrame(tick);
  }

  function renderTimer(){
    face.classList.toggle("running",st.running);
    right.textContent=st.running?"정지":"시작";
    right.classList.toggle("stop",st.running);
    var started=st.running||st.base>0;
    left.textContent=st.running?"랩":"초기화";
    left.disabled=!st.running&&!started;
    saveRow.hidden=!(!st.running&&st.laps.length>0);
    startNumRow.hidden=st.laps.length>0;
    if(document.activeElement!==startNumInput)startNumInput.value=st.startNum||1;

    var laps=st.laps,mn=null,mx=null;
    if(laps.length>=2){
      mn=laps.reduce(function(a,b){return b.t<a.t?b:a});
      mx=laps.reduce(function(a,b){return b.t>a.t?b:a});
    }
    var out="";
    if(started){
      out+='<li class="lap live"><span class="n">지금</span><span class="t" id="liveT"></span><span class="tot"></span><span style="width:34px"></span></li>';
    }
    for(var i=laps.length-1;i>=0;i--){
      var L=laps[i],tag="";
      if(mn&&mn.id===L.id)tag='<span class="tag">최고속</span>';
      else if(mx&&mx.id===L.id)tag='<span class="tag slow">오래 걸림</span>';
      out+='<li class="lap" data-id="'+L.id+'"><span class="n">'+L.n+"번"+tag+'</span><span class="t">'+plain(L.t)+'</span><span class="tot">'+txt(L.total)+'</span><button class="iconbtn" type="button" aria-label="'+L.n+'번 기록 지우기" data-del="'+L.id+'"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button></li>';
    }
    lapsEl.innerHTML=out;
    var live=document.getElementById("liveT");if(live)live.__v="";
    empty.hidden=started||laps.length>0;
    head.hidden=laps.length===0;
    count.textContent=laps.length?"기록 "+laps.length+"개":"";
    avgNow.textContent=laps.length?"평균 "+txt(avgOf(laps)):"";
    lastBig="";lastCur="";
    cancelAnimationFrame(raf);tick();
  }

  function renderArchive(){
    setCount.textContent=sets.length;
    setEmpty.hidden=sets.length>0;
    importRow.hidden=!(useCloud()&&hasGuestSets());
    var out="";
    var sorted=sets.slice().sort(function(a,b){return b.savedAt-a.savedAt});
    for(var i=0;i<sorted.length;i++){
      var S=sorted[i];
      out+='<li class="setcard" data-id="'+S.id+'" tabindex="0" role="button">'+
        '<div class="top"><div><div class="name">'+esc(S.name)+'</div><div class="date">'+fmtDate(S.savedAt)+'</div></div>'+
        '<button class="iconbtn" type="button" aria-label="'+esc(S.name)+' 세트 지우기" data-delset="'+S.id+'"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button></div>'+
        (S.note?'<div class="note">'+esc(S.note)+'</div>':'<div class="note" style="opacity:.5">세부내용 없음</div>')+
        '<div class="stats"><span>문항 <b>'+S.laps.length+'</b>개</span><span>평균 <b>'+txt(avgOf(S.laps))+'</b></span></div>'+
        '</li>';
    }
    setlist.innerHTML=out;
  }

  function switchTab(t){
    tab=t;
    document.querySelectorAll(".tabbtn").forEach(function(b){b.classList.toggle("active",b.dataset.tab===t)});
    viewTimer.hidden=t!=="timer";
    viewArchive.hidden=t!=="archive";
    if(t==="archive")renderArchive();
  }

  async function keepAwake(on){
    try{
      if(on&&"wakeLock" in navigator){wake=await navigator.wakeLock.request("screen")}
      else if(wake){await wake.release();wake=null}
    }catch(e){}
  }

  function start(){
    if(st.running)return;
    st.startAt=Date.now();st.running=true;save();keepAwake(true);renderTimer();
  }
  function stop(){
    if(!st.running)return;
    st.base=now();st.running=false;save();keepAwake(false);renderTimer();
  }
  function lap(){
    if(!st.running)return;
    var t=now();
    st.seq=(st.seq||0)+1;
    var n=st.laps.length?st.laps[st.laps.length-1].n+1:(parseInt(st.startNum,10)||1);
    st.laps.push({id:st.seq,n:n,t:t-st.lapBase,total:t});
    st.lapBase=t;save();renderTimer();
  }
  function resetTimer(){
    var keepStart=st.startNum||1;
    st={running:false,startAt:0,base:0,lapBase:0,laps:[],seq:0,startNum:keepStart};save();renderTimer();
  }
  function delLap(id){
    var el=lapsEl.querySelector('[data-id="'+id+'"]');
    var go=function(){st.laps=st.laps.filter(function(l){return l.id!==id});save();renderTimer()};
    if(el){el.classList.add("out");setTimeout(go,220)}else go();
  }

  function showToast(msg){
    toastEl.textContent=msg;toastEl.classList.add("show");
    clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("show")},1800);
  }

  function openSave(){
    if(!st.laps.length)return;
    setName.value="";setNote.value="";
    saveOverlay.hidden=false;setTimeout(function(){setName.focus()},50);
  }
  function closeSave(){saveOverlay.hidden=true}
  async function confirmSave(){
    var name=setName.value.trim();
    if(!name){setName.focus();return}
    var note=setNote.value.trim();
    var laps=st.laps.map(function(l){return{n:l.n,t:l.t}});
    saveConfirm.disabled=true;
    if(useCloud()){
      var res=await sb.from("sets").insert({user_id:user.id,name:name,note:note,laps:laps}).select().single();
      saveConfirm.disabled=false;
      if(res.error){showToast("저장 실패: "+res.error.message);return}
      sets.unshift(rowToSet(res.data));
    }else{
      var id=Date.now()+Math.random();
      sets.push({id:id,name:name,note:note,laps:laps,savedAt:Date.now()});
      saveSets();
      saveConfirm.disabled=false;
    }
    renderArchive();
    closeSave();
    resetTimer();
    showToast('"'+name+'" 저장 완료');
  }

  function openDetail(id){
    var S=sets.filter(function(s){return String(s.id)===String(id)})[0];if(!S)return;
    dTitle.textContent=S.name;
    dNote.textContent=S.note||"세부내용이 없어요.";
    dAvg.innerHTML=plain(avgOf(S.laps));
    dTotal.innerHTML=plain(S.laps.reduce(function(a,l){return a+l.t},0));
    dCount.textContent=S.laps.length+"개";
    var mn=null,mx=null;
    if(S.laps.length>=2){mn=S.laps.reduce(function(a,b){return b.t<a.t?b:a});mx=S.laps.reduce(function(a,b){return b.t>a.t?b:a})}
    var out="";
    for(var i=S.laps.length-1;i>=0;i--){
      var L=S.laps[i],tag="";
      if(mn&&mn===L)tag='<span class="tag">최고속</span>';else if(mx&&mx===L)tag='<span class="tag slow">오래 걸림</span>';
      out+='<li class="lap"><span class="n">'+L.n+"번"+tag+'</span><span class="t">'+plain(L.t)+'</span><span></span><span></span></li>';
    }
    dLaps.innerHTML=out;
    detailOverlay.hidden=false;
  }
  function closeDetail(){detailOverlay.hidden=true}
  function delSet(id){
    var el=setlist.querySelector('[data-id="'+id+'"]');
    var go=async function(){
      if(useCloud()){
        var res=await sb.from("sets").delete().eq("id",id);
        if(res.error){showToast("삭제 실패: "+res.error.message);return}
        sets=sets.filter(function(s){return String(s.id)!==String(id)});
      }else{
        sets=sets.filter(function(s){return String(s.id)!==String(id)});
        saveSets();
      }
      renderArchive();
    };
    if(el){el.classList.add("out");setTimeout(go,220)}else go();
  }

  function clampStart(v){v=parseInt(v,10);if(!v||v<1)v=1;return v}
  function setStartNum(v){st.startNum=clampStart(v);startNumInput.value=st.startNum;save()}
  startNumInput.addEventListener("input",function(){if(startNumInput.value!=="")setStartNum(startNumInput.value)});
  startNumInput.addEventListener("blur",function(){setStartNum(startNumInput.value)});
  snMinus.addEventListener("click",function(){setStartNum((st.startNum||1)-1)});
  snPlus.addEventListener("click",function(){setStartNum((st.startNum||1)+1)});

  function translateAuthError(msg){
    msg=msg||"";
    if(/Invalid login credentials/i.test(msg))return "이메일 또는 비밀번호가 올바르지 않아요.";
    if(/already registered|already exists/i.test(msg))return "이미 가입된 이메일이에요. 로그인해주세요.";
    if(/Password should be|at least 6/i.test(msg))return "비밀번호는 6자 이상이어야 해요.";
    if(/rate limit/i.test(msg))return "요청이 너무 많아요. 잠시 후 다시 시도해주세요.";
    if(/Unable to validate email|invalid email/i.test(msg))return "이메일 형식을 확인해주세요.";
    return msg;
  }

  var authMode="login";
  function syncAuthTexts(){
    authTitle.textContent=authMode==="login"?"로그인":"회원가입";
    authSubmit.textContent=authMode==="login"?"로그인":"가입하기";
    authToggle.textContent=authMode==="login"?"계정이 없으신가요? 회원가입":"이미 계정이 있으신가요? 로그인";
  }
  function openAuth(mode){
    authMode=mode||"login";
    authEmail.value="";authPw.value="";authErr.hidden=true;authErr.style.color="";
    syncAuthTexts();
    authOverlay.hidden=false;setTimeout(function(){authEmail.focus()},50);
  }
  function closeAuth(){authOverlay.hidden=true}

  async function performAuth(mode,email,pw){
    if(!email||!pw)return{ok:false,msg:"이메일과 비밀번호를 입력해주세요."};
    if(pw.length<6)return{ok:false,msg:"비밀번호는 6자 이상이어야 해요."};
    try{
      if(mode==="login"){
        var res=await sb.auth.signInWithPassword({email:email,password:pw});
        if(res.error)throw res.error;
        return{ok:true};
      }else{
        var res2=await sb.auth.signUp({email:email,password:pw});
        if(res2.error)throw res2.error;
        if(res2.data&&res2.data.user&&!res2.data.session){
          return{ok:true,needsConfirmation:true,msg:"가입 확인 메일을 보냈어요. 메일함을 확인한 뒤 로그인해주세요!"};
        }
        return{ok:true};
      }
    }catch(e){
      return{ok:false,msg:translateAuthError(e&&e.message)};
    }
  }

  async function submitAuth(){
    var email=authEmail.value.trim(),pw=authPw.value;
    authErr.hidden=true;authErr.style.color="";
    authSubmit.disabled=true;
    var r=await performAuth(authMode,email,pw);
    authSubmit.disabled=false;
    if(!r.ok){authErr.textContent=r.msg;authErr.hidden=false;return}
    if(r.needsConfirmation){
      authErr.style.color="var(--ink)";authErr.textContent=r.msg;authErr.hidden=false;
      authMode="login";syncAuthTexts();return;
    }
    closeAuth();
    showToast(authMode==="login"?"로그인 완료":"가입 완료! 로그인 되었어요");
  }

  function updateAuthUI(){
    if(!cloudReady){
      authStatus.textContent="게스트 모드 (클라우드 로그인 미설정)";
      authBtn.textContent="설정 필요";authBtn.disabled=true;
      return;
    }
    if(user){
      authStatus.textContent=(user.email||"")+"님으로 로그인됨";
      authBtn.textContent="로그아웃";
    }else{
      authStatus.textContent="게스트로 사용 중";
      authBtn.textContent="로그인";
    }
    authBtn.disabled=false;
  }

  async function importGuestSets(){
    var raw=loadLocalSetsRaw();
    if(!raw.length){showToast("가져올 게스트 기록이 없어요");return}
    importBtn.disabled=true;
    var ok=0,fail=0;
    for(var i=0;i<raw.length;i++){
      var s=raw[i];
      var res=await sb.from("sets").insert({
        user_id:user.id,name:s.name,note:s.note||"",laps:s.laps||[],
        saved_at:s.savedAt?new Date(s.savedAt).toISOString():new Date().toISOString()
      });
      if(res.error)fail++;else ok++;
    }
    importBtn.disabled=false;
    if(ok){try{localStorage.removeItem(SETKEY)}catch(e){}}
    showToast(fail?("가져오기 "+ok+"개 완료, "+fail+"개 실패"):("게스트 기록 "+ok+"개 가져오기 완료"));
    loadSets();
  }

  var GUESTKEY="piyak-guest-ok";
  function hasGuestOk(){try{return localStorage.getItem(GUESTKEY)==="1"}catch(e){return false}}
  function setGuestOk(){try{localStorage.setItem(GUESTKEY,"1")}catch(e){}}
  function hideSplash(){splash.hidden=true}
  function showSplash(){splash.hidden=false;setTimeout(function(){splashEmail.focus()},80)}

  var splashMode="login";
  function syncSplashTexts(){
    splashTitle.textContent=splashMode==="login"?"로그인":"회원가입";
    splashSubmit.textContent=splashMode==="login"?"로그인":"가입하기";
    splashToggle.textContent=splashMode==="login"?"계정이 없으신가요? 회원가입":"이미 계정이 있으신가요? 로그인";
  }
  async function submitSplashAuth(){
    var email=splashEmail.value.trim(),pw=splashPw.value;
    splashErr.hidden=true;splashErr.style.color="";
    splashSubmit.disabled=true;
    var r=await performAuth(splashMode,email,pw);
    splashSubmit.disabled=false;
    if(!r.ok){splashErr.textContent=r.msg;splashErr.hidden=false;return}
    if(r.needsConfirmation){
      splashErr.style.color="var(--ink)";splashErr.textContent=r.msg;splashErr.hidden=false;
      splashMode="login";syncSplashTexts();return;
    }
    hideSplash();
    showToast(splashMode==="login"?"로그인 완료":"가입 완료! 로그인 되었어요");
  }
  splashToggle.addEventListener("click",function(){splashMode=splashMode==="login"?"signup":"login";splashErr.hidden=true;syncSplashTexts()});
  splashSubmit.addEventListener("click",submitSplashAuth);
  splashPw.addEventListener("keydown",function(e){if(e.key==="Enter")submitSplashAuth()});
  splashGuestBtn.addEventListener("click",function(){setGuestOk();hideSplash()});

  right.addEventListener("click",function(){st.running?stop():start()});
  left.addEventListener("click",function(){st.running?lap():resetTimer()});
  lapsEl.addEventListener("click",function(e){var b=e.target.closest("[data-del]");if(b)delLap(+b.getAttribute("data-del"))});
  saveBtn.addEventListener("click",openSave);
  saveCancel.addEventListener("click",closeSave);
  saveConfirm.addEventListener("click",confirmSave);
  saveOverlay.addEventListener("click",function(e){if(e.target===saveOverlay)closeSave()});
  detailClose.addEventListener("click",closeDetail);
  detailOverlay.addEventListener("click",function(e){if(e.target===detailOverlay)closeDetail()});
  setlist.addEventListener("click",function(e){
    var d=e.target.closest("[data-delset]");
    if(d){e.stopPropagation();delSet(d.getAttribute("data-delset"));return}
    var c=e.target.closest(".setcard");if(c)openDetail(c.getAttribute("data-id"));
  });
  document.querySelectorAll(".tabbtn").forEach(function(b){b.addEventListener("click",function(){switchTab(b.dataset.tab)})});
  authBtn.addEventListener("click",function(){
    if(!cloudReady){showToast("Supabase 설정이 아직 안 되어 있어요");return}
    if(user){sb.auth.signOut()}else{openAuth("login")}
  });
  authCancel.addEventListener("click",closeAuth);
  authSubmit.addEventListener("click",submitAuth);
  authToggle.addEventListener("click",function(){authMode=authMode==="login"?"signup":"login";authErr.hidden=true;syncAuthTexts()});
  authOverlay.addEventListener("click",function(e){if(e.target===authOverlay)closeAuth()});
  authPw.addEventListener("keydown",function(e){if(e.key==="Enter")submitAuth()});
  importBtn.addEventListener("click",importGuestSets);
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){if(!saveOverlay.hidden)closeSave();if(!detailOverlay.hidden)closeDetail();if(!authOverlay.hidden)closeAuth();return}
    if(!saveOverlay.hidden||!detailOverlay.hidden||!authOverlay.hidden)return;
    if(e.target&&e.target.tagName==="INPUT")return;
    if(e.code==="Space"){e.preventDefault();st.running?stop():start()}
    else if(e.key==="l"||e.key==="L"){if(st.running)lap()}
  });
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"){if(st.running)keepAwake(true);cancelAnimationFrame(raf);tick()}
  });

  load();
  if(st.running&&!st.startAt)st.running=false;
  renderTimer();
  updateAuthUI();
  if(cloudReady){
    sb.auth.onAuthStateChange(function(event,session){
      user=session&&session.user?session.user:null;
      updateAuthUI();
      loadSets();
    });
    sb.auth.getSession().then(function(res){
      var sessUser=res&&res.data&&res.data.session&&res.data.session.user;
      if(sessUser){
        user=sessUser;updateAuthUI();loadSets();hideSplash();
      }else if(hasGuestOk()){
        loadSets();hideSplash();
      }else{
        loadSets();showSplash();
      }
    });
  }else{
    hideSplash();
    loadSets();
  }
})();
</script>
</body>
</html>
